services:
  pulse:
    image: larsmikki/pulse:latest
    container_name: pulse
    ports:
      - "3040:3040"
    volumes:
      - pulse-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3040/api/health"]
      interval: 5m
      timeout: 5s
      retries: 3

volumes:
  pulse-data:
