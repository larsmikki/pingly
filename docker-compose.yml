services:
  pingr:
    image: larsmikki/pingr:latest
    container_name: pingr
    ports:
      - "3040:3040"
    volumes:
      - pingr-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3040/api/health"]
      interval: 5m
      timeout: 5s
      retries: 3

volumes:
  pingr-data:
